name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -p no:warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          (cd frontend && npm ci)
          (cd frontend && npx playwright install --with-deps chromium)
      - name: Init database (migrations + demo seed)
        working-directory: backend
        run: python scripts/init_db.py
      - name: Start backend
        run: |
          (cd backend && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > backend.log 2>&1 &)
      - name: Start frontend
        run: |
          (cd frontend && nohup npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > vite.log 2>&1 &)
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8001/api/health > /dev/null || (cat backend/backend.log; exit 1)
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5173/ > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5173/ > /dev/null || (cat frontend/vite.log; exit 1)
      - name: Run Playwright E2E
        working-directory: frontend
        env:
          E2E_API_BASE: http://127.0.0.1:8001/api
        run: |
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"demo@tradesense-demo.cn","password":"demo1234"}' | python -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          E2E_TOKEN=$TOKEN npx playwright test
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            backend/backend.log
            frontend/vite.log
            frontend/test-results/
          if-no-files-found: ignore
